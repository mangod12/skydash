name: SkyDash CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skydash/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skydash/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: skydash/frontend/dist/
          retention-days: 7

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start backend
        run: python main.py &
        env:
          SKYDASH_PORT: 8001
      - name: Wait for server
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8001/health && break || sleep 1
          done
      - name: API smoke tests
        run: |
          curl -sf http://localhost:8001/health | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='healthy'"
          curl -sf http://localhost:8001/telemetry | python -c "import sys,json; d=json.load(sys.stdin); assert d['success'] and len(d['data'])==3"
          curl -sf http://localhost:8001/api/entities | python -c "import sys,json; d=json.load(sys.stdin); assert d['success']"
          curl -sf http://localhost:8001/api/timeline | python -c "import sys,json; d=json.load(sys.stdin); assert d['success']"
          echo "All API tests passed"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t skydash-backend .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t skydash-frontend .
      - name: Verify images
        run: |
          docker images | grep skydash
          echo "Docker images built successfully"

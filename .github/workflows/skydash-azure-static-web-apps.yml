name: Deploy Skydash to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "skydash/frontend/**"
      - ".github/workflows/skydash-azure-static-web-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

# PRs are tested by SkyDash CI, but must never deploy to production.
# Only one production deployment runs at a time. GitHub keeps the latest
# pending run when merges arrive during a deployment, avoiding a deploy queue.
concurrency:
  group: skydash-azure-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  APP_LOCATION: skydash/frontend
  APP_ARTIFACT_LOCATION: dist

jobs:
  build_and_deploy_job:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_LOCATION }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_LOCATION }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.APP_LOCATION }}
        run: npm run lint

      - name: Test
        working-directory: ${{ env.APP_LOCATION }}
        run: npm test

      - name: Build
        working-directory: ${{ env.APP_LOCATION }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
          VITE_ADSB_URL: ${{ vars.VITE_ADSB_URL }}
          VITE_ESRI_API_KEY: ${{ vars.VITE_ESRI_API_KEY }}
        run: npm run build

      - name: Deploy
        working-directory: ${{ env.APP_LOCATION }}
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: npx -y @azure/static-web-apps-cli@2 deploy ./${{ env.APP_ARTIFACT_LOCATION }} --env production --deployment-token "$SWA_CLI_DEPLOYMENT_TOKEN"

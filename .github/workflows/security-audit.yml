name: Dependency Audit

# Runs weekly and on PRs that touch dependency files, so a newly published
# advisory never blocks unrelated PRs but is still caught within a week.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/requirements*.txt'
      - 'skydash/frontend/package.json'
      - 'skydash/frontend/package-lock.json'
      - '.github/workflows/security-audit.yml'

permissions:
  contents: read

jobs:
  python:
    name: pip-audit (backend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt
      - name: Audit optional real-drone dependencies
        run: pip-audit -r backend/requirements_real_drone.txt

  node:
    name: npm audit (frontend, production deps)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: skydash/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install pip-audit
      - run: mkdir -p sbom
      - run: pip-audit -r backend/requirements.txt --format cyclonedx-json --output sbom/backend.cdx.json
      - run: npm ci
        working-directory: skydash/frontend
      - run: npm sbom --omit=dev --sbom-format cyclonedx > ../../sbom/frontend.cdx.json
        working-directory: skydash/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: skydash-sbom
          path: sbom/
          retention-days: 90

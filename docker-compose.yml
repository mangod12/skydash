services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8001:8001"
    environment:
      - SKYDASH_HOST=0.0.0.0
      - SKYDASH_PORT=8001
      - SKYDASH_DB_PATH=/app/data/skydash.db
      - SKYDASH_API_KEY=${SKYDASH_API_KEY:-}
      - SKYDASH_JWT_SECRET=${SKYDASH_JWT_SECRET:-}
    volumes:
      - skydash-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  crewai:
    profiles:
      - crew
    build:
      context: .
      dockerfile: Dockerfile.crewai
    environment:
      SKYDASH_API_URL: http://backend:8001
      SKYDASH_FRONTEND_URL: http://frontend
      SKYDASH_CREW_FOCUS: ${SKYDASH_CREW_FOCUS:-SkyDash operating readiness from the Docker stack}
      SKYDASH_CREW_DATE: ${SKYDASH_CREW_DATE:-}
      MODEL: ${MODEL:-openai/mimo-v2.5-pro}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    volumes:
      - ./skydash_intel_crew/reports:/workspace/skydash_intel_crew/reports
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

volumes:
  skydash-data:

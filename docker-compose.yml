services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8001:8001"
    environment:
      - SKYDASH_HOST=0.0.0.0
      - SKYDASH_PORT=8001
      - SKYDASH_DB_PATH=/app/data/skydash.db
      - SKYDASH_API_KEY=${SKYDASH_API_KEY:-}
      - SKYDASH_JWT_SECRET=${SKYDASH_JWT_SECRET:-}
    volumes:
      - skydash-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  skydash-data:
